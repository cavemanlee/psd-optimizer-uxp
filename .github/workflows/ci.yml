name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest
        run: python3 -m json.tool plugin/manifest.json >/dev/null

      - name: Test Windows installer transactions
        run: go test -count=1 ./...

      - name: Test plug-in UI state behavior
        run: node tests/verify-ui-behavior.cjs
